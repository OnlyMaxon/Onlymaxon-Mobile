# The card Worker: onlymaxon.com/u/* and onlymaxon.com/card/*
#
# Routes, not a *.workers.dev subdomain. The URL is printed on a plastic card that cannot
# be reprinted, so it has to be on the domain that will still be ours in five years — and
# a card on a workers.dev address would also have no claim to the trust the main domain
# has already earned with Google.
#
# Everything outside these two prefixes still goes to GitHub Pages exactly as before: a
# route is a prefix match, so /services/, /blog/ and the five language trees never reach
# this Worker at all.

name = "onlymaxon-cards"
main = "src/index.js"
compatibility_date = "2026-10-01"

workers_dev = false

routes = [
  { pattern = "onlymaxon.com/u/*",    zone_name = "onlymaxon.com" },
  { pattern = "onlymaxon.com/card",   zone_name = "onlymaxon.com" },
  { pattern = "onlymaxon.com/card/*", zone_name = "onlymaxon.com" },
]

# ── D1 ───────────────────────────────────────────────────────────────────────
# Create it once, then paste the id this prints:
#   npx wrangler d1 create onlymaxon-cards
[[d1_databases]]
binding = "DB"
database_name = "onlymaxon-cards"
database_id = "b1d07188-6484-46a5-b745-347f0aae29d1"

# ── R2 ───────────────────────────────────────────────────────────────────────
# Private bucket. The Worker streams the bytes on /u/<slug>/photo, so there is no second
# public URL for somebody's face that outlives the card and cannot be taken down.
#
# COMMENTED OUT ON PURPOSE. R2 has to be switched on once in the Cloudflare dashboard
# before any bucket can exist, and a binding to a bucket that is not there fails the
# deploy — which would hold up the part of the product that works perfectly without
# photos. A card with no photo shows its owner's initial, which is a finished look.
#
# To turn photos on: enable R2 in the dashboard, then
#   npx wrangler r2 bucket create onlymaxon-card-photos
# uncomment the three lines below, and deploy again. Nothing else changes: the Worker
# already checks whether the binding exists before it touches it.
#
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "onlymaxon-card-photos"

[vars]
# Shown as the From: on the sign-in email. The domain has to be verified in Resend or the
# message is rejected — see card/README.md.
MAIL_FROM = "OnlyMaxon <hello@onlymaxon.com>"

# ── secrets, set with `wrangler secret put` and never written in this file ───
#   npx wrangler secret put RESEND_KEY
#   npx wrangler secret put PROVISION_KEY
#
# PROVISION_KEY authorises POST /card/api/cards — the only way a card is created. The phone
# app holds the other copy, in the device keychain, and sends it when a chip is written.
# Without the secret that route answers 503 rather than accepting anything: a provisioning
# endpoint that is open because a key was forgotten is worse than one that is down.
#
# Without RESEND_KEY the sign-in link is printed to the Worker log instead of being
# emailed, and the form says plainly that it could not send. That is deliberate: during
# setup you can read the log and get in, and in production a missing key is loud rather
# than a form that appears to work and quietly sends nothing.
